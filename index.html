<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- YouTube Error 153 fix -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>कमरको व्यायाम तालिका</title>

  <style>
    :root {
      --bg: #eef3ff;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #16a34a;
      --orange: #f97316;
      --red: #dc2626;
      --border: #e5e7eb;
      --soft: #f8fafc;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 32%),
        radial-gradient(circle at bottom right, #e0e7ff 0, transparent 34%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 14px;
      padding-bottom: 96px;
    }

    .topbar {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: #fff;
      padding: 22px 18px;
      border-radius: 0 0 30px 30px;
      margin: -14px -14px 14px;
      box-shadow: var(--shadow);
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.4px;
    }

    .topbar p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.94;
    }

    .progress-wrap {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .progress-text {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.95;
    }

    .warning-card {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #7c2d12;
      padding: 13px 14px;
      border-radius: 18px;
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .exercise-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: cardIn 0.25s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .exercise-head {
      padding: 17px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .badge.green {
      background: #ecfdf3;
      color: #15803d;
      border-color: #bbf7d0;
    }

    .badge.orange {
      background: #fff7ed;
      color: #c2410c;
      border-color: #fed7aa;
    }

    .exercise-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: -0.35px;
    }

    .exercise-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .visual-area {
      padding: 16px;
      background: linear-gradient(180deg, #f8fbff, #ffffff);
    }

    .animation-stage {
      position: relative;
      height: 230px;
      background:
        linear-gradient(180deg, rgba(219, 234, 254, 0.75), rgba(255, 255, 255, 0.9));
      border: 1px solid #dbeafe;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .label-bubble {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #dbeafe;
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 13px;
      color: #334155;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      z-index: 2;
    }

    .floor {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 54px;
      height: 10px;
      border-radius: 999px;
      background: #bfdbfe;
    }

    .mat {
      position: absolute;
      left: 45px;
      right: 45px;
      bottom: 38px;
      height: 22px;
      border-radius: 999px;
      background: #60a5fa;
      opacity: 0.65;
    }

    .bench {
      position: absolute;
      left: 75px;
      bottom: 62px;
      width: 105px;
      height: 14px;
      background: #60a5fa;
      border-radius: 999px;
      display: none;
    }

    .bench::before,
    .bench::after {
      content: "";
      position: absolute;
      top: 12px;
      width: 8px;
      height: 60px;
      background: #2563eb;
      border-radius: 999px;
    }

    .bench::before {
      left: 12px;
    }

    .bench::after {
      right: 12px;
    }

    .person {
      position: absolute;
      left: 50%;
      bottom: 60px;
      width: 240px;
      height: 145px;
      transform: translateX(-50%);
    }

    .head,
    .body,
    .arm,
    .leg,
    .leg2,
    .forearm,
    .thigh,
    .shin {
      position: absolute;
      background: #1e293b;
      border-radius: 999px;
      transform-origin: left center;
    }

    .head {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f59e0b;
      border: 4px solid #1e293b;
    }

    .video-title {
      font-size: 14px;
      font-weight: 800;
      color: #1e293b;
      margin: 4px 0 8px;
    }

    .video-frame {
      position: relative;
      width: 100%;
      background: #0f172a;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid #dbeafe;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
    }

    .video-frame.youtube {
      aspect-ratio: 16 / 9;
    }

    .video-frame.tiktok {
      width: min(100%, 360px);
      height: 760px;
      margin: 0 auto;
      border-radius: 24px;
      background: #000;
    }

    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0f172a;
    }

    .video-frame.tiktok iframe {
      overflow: hidden;
    }

    .details {
      padding: 0 16px 16px;
    }

    .rep-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .rep-box strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .rep-box span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    .instruction {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 13px 14px;
      margin-bottom: 12px;
    }

    .instruction h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .instruction ul {
      margin: 0;
      padding-left: 20px;
    }

    .instruction li {
      margin-bottom: 5px;
      font-size: 14px;
      color: #344054;
    }

    .danger {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .actions {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 560px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: linear-gradient(180deg, rgba(238, 243, 255, 0), rgba(238, 243, 255, 0.98) 28%);
      padding: 18px 14px 14px;
      z-index: 50;
    }

    .btn {
      border: 0;
      border-radius: 18px;
      padding: 15px 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.24);
    }

    .btn-light {
      background: #ffffff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 1. Prone hip extension */
    .anim-prone-hip .head { left: 38px; top: 76px; }
    .anim-prone-hip .body { left: 65px; top: 91px; width: 100px; height: 12px; }
    .anim-prone-hip .arm { left: 72px; top: 104px; width: 55px; height: 9px; transform: rotate(10deg); background:#475569; }
    .anim-prone-hip .leg { left: 158px; top: 91px; width: 68px; height: 10px; background:#1e293b; animation: proneLegLift 1.7s infinite ease-in-out; }
    .anim-prone-hip .leg2 { left: 158px; top: 104px; width: 64px; height: 10px; background:#64748b; }

    @keyframes proneLegLift {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-24deg); }
    }

    /* 2. Prone on elbows */
    .anim-elbow .head { left: 45px; top: 44px; }
    .anim-elbow .body { left: 72px; top: 68px; width: 105px; height: 12px; transform: rotate(9deg); }
    .anim-elbow .arm { left: 82px; top: 78px; width: 54px; height: 9px; transform: rotate(74deg); background:#475569; }
    .anim-elbow .forearm { left: 95px; top: 117px; width: 58px; height: 9px; background:#475569; }
    .anim-elbow .leg { left: 165px; top: 83px; width: 65px; height: 10px; }
    .anim-elbow .person { animation: softBreath 2s infinite ease-in-out; }

    @keyframes softBreath {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }

    /* 3. Prone trunk lift */
    .anim-trunk .head { left: 42px; top: 54px; animation: trunkHead 1.8s infinite ease-in-out; }
    .anim-trunk .body { left: 70px; top: 78px; width: 105px; height: 12px; animation: trunkLift 1.8s infinite ease-in-out; }
    .anim-trunk .arm { left: 78px; top: 96px; width: 55px; height: 9px; background:#475569; animation: trunkArm 1.8s infinite ease-in-out; }
    .anim-trunk .leg { left: 165px; top: 91px; width: 64px; height: 10px; }
    .anim-trunk .leg2 { left: 165px; top: 104px; width: 62px; height: 10px; background:#64748b; }

    @keyframes trunkLift {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-14deg); }
    }

    @keyframes trunkHead {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    @keyframes trunkArm {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg) translateY(-10px); }
    }

    /* 4. Active straight leg raise */
    .anim-slr .head { left: 30px; top: 80px; }
    .anim-slr .body { left: 60px; top: 95px; width: 100px; height: 12px; }
    .anim-slr .arm { left: 78px; top: 112px; width: 54px; height: 9px; background:#475569; }
    .anim-slr .leg { left: 156px; top: 96px; width: 72px; height: 10px; animation: slrLift 1.9s infinite ease-in-out; }
    .anim-slr .leg2 { left: 150px; top: 108px; width: 62px; height: 10px; background:#64748b; transform: rotate(34deg); }

    @keyframes slrLift {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-55deg); }
    }

    /* 5. Bridge */
    .anim-bridge .head { left: 32px; top: 92px; }
    .anim-bridge .body { left: 62px; top: 103px; width: 95px; height: 12px; animation: bridgeBody 1.7s infinite ease-in-out; }
    .anim-bridge .thigh { left: 150px; top: 102px; width: 46px; height: 10px; transform: rotate(42deg); animation: bridgeThigh 1.7s infinite ease-in-out; }
    .anim-bridge .shin { left: 186px; top: 132px; width: 42px; height: 10px; transform: rotate(90deg); }
    .anim-bridge .arm { left: 75px; top: 120px; width: 55px; height: 8px; background:#475569; }

    @keyframes bridgeBody {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-20deg) translateY(-18px); }
    }

    @keyframes bridgeThigh {
      0%, 100% { transform: rotate(42deg) translateY(0); }
      50% { transform: rotate(62deg) translateY(-23px); }
    }

    /* 6. 90/90 hamstring */
    .anim-ham .head { left: 30px; top: 92px; }
    .anim-ham .body { left: 60px; top: 106px; width: 95px; height: 12px; }
    .anim-ham .thigh { left: 152px; top: 103px; width: 60px; height: 10px; transform: rotate(-82deg); background:#1e293b; }
    .anim-ham .shin { left: 160px; top: 48px; width: 66px; height: 10px; background:#1e293b; animation: kneeExtend 1.8s infinite ease-in-out; transform-origin: left center; }
    .anim-ham .arm { left: 123px; top: 83px; width: 50px; height: 8px; transform: rotate(-35deg); background:#475569; }
    .anim-ham .forearm { left: 126px; top: 94px; width: 50px; height: 8px; transform: rotate(-55deg); background:#475569; }

    @keyframes kneeExtend {
      0%, 100% { transform: rotate(92deg); }
      50% { transform: rotate(8deg); }
    }

    /* 7. Pelvic tilt */
    .anim-tilt .head { left: 30px; top: 92px; }
    .anim-tilt .body { left: 60px; top: 106px; width: 96px; height: 12px; animation: pelvicTilt 1.4s infinite ease-in-out; }
    .anim-tilt .thigh { left: 150px; top: 105px; width: 45px; height: 10px; transform: rotate(38deg); }
    .anim-tilt .shin { left: 185px; top: 134px; width: 45px; height: 10px; transform: rotate(90deg); }
    .anim-tilt .arm { left: 72px; top: 124px; width: 58px; height: 8px; background:#475569; }

    @keyframes pelvicTilt {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-8deg) translateY(-4px); }
    }

    /* 8. Seated knee extension */
    .anim-knee .floor {
      bottom: 36px;
    }

    .anim-knee .mat {
      display: none;
    }

    .anim-knee .bench {
      display: block;
    }

    .anim-knee .head { left: 85px; top: 28px; }
    .anim-knee .body { left: 100px; top: 60px; width: 12px; height: 62px; transform: rotate(8deg); }
    .anim-knee .arm { left: 106px; top: 75px; width: 45px; height: 8px; transform: rotate(42deg); background:#475569; }
    .anim-knee .thigh { left: 110px; top: 121px; width: 58px; height: 10px; }
    .anim-knee .shin { left: 164px; top: 121px; width: 66px; height: 10px; transform-origin: left center; animation: kneeKick 1.7s infinite ease-in-out; }

    @keyframes kneeKick {
      0%, 100% { transform: rotate(88deg); }
      50% { transform: rotate(0deg); }
    }

    @media (max-width: 430px) {
      .video-frame.tiktok {
        width: 100%;
        height: 720px;
      }
    }

    @media (max-width: 380px) {
      .animation-stage {
        height: 210px;
      }

      .exercise-title {
        font-size: 20px;
      }

      .video-frame.tiktok {
        height: 700px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <h1>कमरको व्यायाम तालिका</h1>
      <p>L4-L5 / L5-S1 डिस्क बल्जका लागि फिजियो व्यायाम</p>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="progress-text" id="progressText">व्यायाम १ / ८</div>
    </header>

    <section class="warning-card">
      <strong>सावधानी:</strong>
      खुट्टातिर दुखाइ, झमझमाहट, numbness, कमजोरी वा चक्कर बढेमा व्यायाम रोक्नुहोस्।
    </section>

    <section class="exercise-card" id="exerciseCard">
      <div class="exercise-head">
        <div class="badge-row">
          <span class="badge" id="exerciseNumber">१</span>
          <span class="badge green">१० पटक</span>
          <span class="badge orange">१० सेकेन्ड होल्ड</span>
          <span class="badge">दिनमा २ पटक</span>
        </div>

        <h2 class="exercise-title" id="exerciseTitle"></h2>
        <div class="exercise-subtitle" id="exerciseSubtitle"></div>
      </div>

      <div class="visual-area">
        <div class="animation-stage" id="animationStage">
          <div class="label-bubble" id="visualTip"></div>
          <div class="floor"></div>
          <div class="mat"></div>
          <div class="bench"></div>

          <div class="person">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm"></div>
            <div class="forearm"></div>
            <div class="leg"></div>
            <div class="leg2"></div>
            <div class="thigh"></div>
            <div class="shin"></div>
          </div>
        </div>

        <div class="video-title" id="videoTitle">व्यायाम भिडियो</div>

        <div class="video-frame youtube" id="videoFrameWrap">
          <iframe
            id="videoFrame"
            src=""
            title="Exercise Video"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <div class="details">
        <div class="rep-box">
          <strong>सेट र रिपिटेसन</strong>
          <span id="setsRepsText">१० पटक × १० सेकेन्ड होल्ड, दिनमा २ पटक</span>
        </div>

        <div class="instruction">
          <h3>कसरी गर्ने?</h3>
          <ul id="stepsList"></ul>
        </div>

        <div class="danger" id="dangerNote"></div>
      </div>
    </section>

    <div class="actions">
      <button class="btn btn-light" id="prevBtn">← पछाडि</button>
      <button class="btn btn-primary" id="nextBtn">अर्को →</button>
    </div>
  </main>

  <script>
    const exercises = [
  {
    title: "घोप्टो परेर सिधा घुँडासहित खुट्टा उठाउने",

  {

  {
    title: "९०/९० ह्यामस्ट्रिङ स्ट्रेच",

  {

    animation: "anim-tilt",

    watchUrl: "https://www.youtube.com/watch?v=TWuR_U9ddcc&t=25s"
  },
  {
    title: "कुर्सीमा बसेर घुँडा सिधा गर्ने",
    subtitle: "Seated Knee Extension / Long Arc Quad",
    animation: "anim-knee",
    videoType: "youtube",
    videoEmbed: "https://www.youtube.com/embed/VuJZ6dqMf8M?si=X0ZUZT3Sx7ezVQT_",
    watchUrl: "https://www.youtube.com/watch?v=VuJZ6dqMf8M"
  }
];

    const nepaliNumbers = ["१", "२", "३", "४", "५", "६", "७", "८"];
    let currentIndex = 0;

    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const exerciseNumber = document.getElementById("exerciseNumber");
    const exerciseTitle = document.getElementById("exerciseTitle");
    const exerciseSubtitle = document.getElementById("exerciseSubtitle");
    const animationStage = document.getElementById("animationStage");
    const visualTip = document.getElementById("visualTip");
    const videoFrameWrap = document.getElementById("videoFrameWrap");
    const videoFrame = document.getElementById("videoFrame");
    const videoTitle = document.getElementById("videoTitle");
    const setsRepsText = document.getElementById("setsRepsText");
    const stepsList = document.getElementById("stepsList");
    const dangerNote = document.getElementById("dangerNote");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const exerciseCard = document.getElementById("exerciseCard");

    function buildEmbedUrl(exercise) {
      const url = exercise.videoEmbed;

      if (exercise.videoType === "youtube") {
        const separator = url.includes("?") ? "&" : "?";

        const origin =
          window.location.origin && window.location.origin !== "null"
            ? window.location.origin
            : "http://localhost";

        return `${url}${separator}rel=0&modestbranding=1&playsinline=1&origin=${encodeURIComponent(origin)}`;
      }

      if (exercise.videoType === "tiktok") {
        const separator = url.includes("?") ? "&" : "?";
        return `${url}${separator}lang=ne-NP`;
      }

      return url;
    }

    function renderExercise() {
      const exercise = exercises[currentIndex];

      exerciseCard.style.animation = "none";
      exerciseCard.offsetHeight;
      exerciseCard.style.animation = "cardIn 0.25s ease";

      exerciseNumber.textContent = nepaliNumbers[currentIndex];
      exerciseTitle.textContent = exercise.title;
      exerciseSubtitle.textContent = exercise.subtitle;
      visualTip.textContent = exercise.tip;
      setsRepsText.textContent = exercise.sets;
      dangerNote.textContent = exercise.danger;

      animationStage.className = "animation-stage " + exercise.animation;

      videoTitle.textContent =
        exercise.videoType === "tiktok"
          ? "TikTok व्यायाम भिडियो"
          : "YouTube व्यायाम भिडियो";

      videoFrameWrap.className = "video-frame " + exercise.videoType;

      videoFrame.removeAttribute("src");
      videoFrame.setAttribute("scrolling", exercise.videoType === "tiktok" ? "no" : "auto");
      videoFrame.src = buildEmbedUrl(exercise);

      stepsList.innerHTML = "";
      exercise.steps.forEach(step => {
        const li = document.createElement("li");
        li.textContent = step;
        stepsList.appendChild(li);
      });

      const progress = ((currentIndex + 1) / exercises.length) * 100;
      progressBar.style.width = progress + "%";
      progressText.textContent = `व्यायाम ${nepaliNumbers[currentIndex]} / ${nepaliNumbers[exercises.length - 1]}`;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.textContent = currentIndex === exercises.length - 1 ? "सुरुमा फर्कनुहोस् ↺" : "अर्को →";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderExercise();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < exercises.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }

      renderExercise();
    });

    renderExercise();
  </script>
</body>
</html>
